<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111215" />
      <stop offset="50%" stop-color="#18191f" />
      <stop offset="100%" stop-color="#0d0e10" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B23A5B" />
      <stop offset="50%" stop-color="#D45476" />
      <stop offset="100%" stop-color="#F5EBE0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#B23A5B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="24" />

  <!-- Diagonal Funky Cyber / Comic Accent Slash -->
  <path d="M 400 48 L 464 112 L 112 464 L 48 400 Z" fill="#B23A5B" opacity="0.12" />

  <!-- Geometric Decorative Corner Marks in Beige & Burgundy -->
  <rect x="56" y="56" width="24" height="6" rx="3" fill="#B23A5B" />
  <rect x="56" y="56" width="6" height="24" rx="3" fill="#B23A5B" />
  <rect x="432" y="450" width="24" height="6" rx="3" fill="#F5EBE0" />
  <rect x="450" y="432" width="6" height="24" rx="3" fill="#F5EBE0" />

  <!-- Offset 3D Pop Shadow for SK -->
  <text x="264" y="342" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="240" 
        letter-spacing="2"
        fill="#000000" 
        opacity="0.95">SK</text>

  <!-- Secondary Pop Glow Shadow in Lighter Burgundy -->
  <text x="259" y="337" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="240" 
        letter-spacing="2"
        fill="#B23A5B" 
        opacity="0.9">SK</text>

  <!-- Front Crisp Lettering in Warm Beige -->
  <text x="252" y="330" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="240" 
        letter-spacing="2"
        fill="#F5EBE0"
        filter="url(#glow)">SK</text>

  <!-- Mini lightning bolt badge in Lighter Burgundy & Beige -->
  <path d="M 378 120 L 354 165 L 372 165 L 350 205 L 396 155 L 374 155 Z" fill="#F5EBE0" />
  <path d="M 376 118 L 352 163 L 370 163 L 348 203 L 394 153 L 372 153 Z" fill="#D45476" />
</svg>